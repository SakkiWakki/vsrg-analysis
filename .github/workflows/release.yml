name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: ./make.bat release
          # ubuntu-22.04 (not -latest) pins glibc 2.35 as the minimum
          # our .so requires. Upgrading to -latest bumps that floor to
          # whatever the newest Ubuntu ships, which breaks users on
          # slightly older distros (Debian stable, RHEL, etc.). Bump
          # deliberately, not automatically.
          - os: ubuntu-22.04
            name: linux
            script: make release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          # See ci.yml comment: 3.12 breaks PySide6+six import chain.
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # Injector + overlay DLL are 32-bit on Windows to match
          # osu!.exe. Linux Wine/winello runs 64-bit osu! so the .so
          # doesn't need the i686 target.
          targets: ${{ matrix.os == 'windows-latest' && 'i686-pc-windows-msvc' || '' }}

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          # The release target also builds a 32-bit .so for osu!stable
          # on classic 32-bit Wine prefixes. That needs multilib gcc
          # plus i386 variants of every -dev lib we link against.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y pkg-config zip \
              libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev \
              gcc-multilib g++-multilib libc6-dev-i386 \
              libx11-dev:i386 libxi-dev:i386 \
              libgl1-mesa-dev:i386 libegl1-mesa-dev:i386

      - name: Build release zip
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Deprecate every prior non-prerelease release by marking it
      # prerelease=true. Users still see them but "Latest" points at
      # whatever we're about to publish.
      - name: Mark prior releases as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ github.ref_name }}'
          gh api "repos/${{ github.repository }}/releases" --paginate \
              --jq '.[] | select(.tag_name != "'"$tag"'" and .prerelease == false) | .id' \
          | while read -r id; do
              echo "[deprecate] marking release $id as prerelease"
              gh api -X PATCH "repos/${{ github.repository }}/releases/$id" \
                  -f prerelease=true > /dev/null
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Auto-detect prereleases from the tag: `v1.0.0` is a real
          # release, `v1.0.0-rc.1` / `v0.1.0-pre` / `v1.0.0-beta` stay
          # out of "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
