name: ci

on:
  push:
    branches: [main]
  pull_request:

# bash on Windows = Git Bash (preinstalled on windows-latest). Avoids
# per-matrix-row `shell:` expressions which the workflow linter chokes
# on before matrix expansion resolves.
defaults:
  run:
    shell: bash

# Opt into Node 24 for JS actions now. Node 20 is deprecated on runners
# and warns on every run; the forced switch lands Jun 2026, so we flip
# early to silence the warning without changing behavior.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_cmd: ./make.bat all
            test_cmd: ./.venv/Scripts/python.exe -m pytest tests/ -q
            rust_targets: i686-pc-windows-msvc
            apt_deps: ''
          # ubuntu-22.04 pins a lower glibc floor than -latest; the .so
          # we build here has to load on users' distros, not just on
          # the newest Ubuntu. Bump this deliberately when needed.
          - os: ubuntu-22.04
            name: linux
            build_cmd: make all
            test_cmd: .venv/bin/python -m pytest tests/ -q
            rust_targets: ''
            apt_deps: 'pkg-config libx11-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux build deps
        if: matrix.apt_deps != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_deps }}

      - name: Build everything
        run: ${{ matrix.build_cmd }}

      - name: Run pytest
        run: ${{ matrix.test_cmd }}
        env:
          QT_QPA_PLATFORM: offscreen
