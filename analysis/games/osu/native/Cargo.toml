[package]
name = "osu_memory_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

# Built as a PyO3 extension module (importable from Python as
# ``osu_memory_native``). The ``abi3-py310`` feature builds against
# CPython's stable ABI — one ``abi3`` wheel loads on 3.10 through
# whatever CPython ships next, so we don't have to matrix-build a
# per-version wheel and ``run.sh`` can pick whichever ``python3`` the
# user has (Arch on 3.14, Debian on 3.11, Ubuntu 22.04 on 3.10, etc.).
[lib]
name = "osu_memory_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
thiserror = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# process_vm_readv lives in libc.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows analogues of libc's process_vm_readv + /proc walk. Features
# enumerate every Win32 namespace we touch; the crate is strict about
# cfg gating so undeclared symbols don't bloat the binary.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }

# ``maturin develop`` will drop the built .so into the active venv's
# site-packages. For now we build in debug; live reading is I/O-bound
# on the syscall so release optimizations are a nice-to-have, not a
# bottleneck.
[profile.release]
lto = "thin"
