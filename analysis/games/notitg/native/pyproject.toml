[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "notitg_frame_native"
version = "0.1.0"
description = "Native script->timeline compiler core for the vsrg-analysis NotITG frame interpreter."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Private :: Do Not Upload",
]

[tool.maturin]
bindings = "pyo3"
# The .so imports as ``notitg_frame_native`` ; match the crate name.
module-name = "notitg_frame_native"
